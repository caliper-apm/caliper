replicaCount: 2

image:
  repository: ghcr.io/caliper-apm/caliper
  tag: "1.8.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

storage:
  driver: clickhouse # embedded | clickhouse
  clickhouseEndpoint: "http://clickhouse:8123"
  clickhouseDatabase: "caliper"
  alertInterval: "30s"

metaStore:
  driver: postgres # embedded | postgres
  postgresDsn: "" # Or inject via CALIPER_POSTGRES_DSN secret env
  migrate: true
  maxConns: 25

objectStore:
  driver: local # local | s3
  s3Endpoint: ""
  s3Bucket: ""
  s3Region: "us-east-1"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
