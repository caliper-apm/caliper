services:
  caliper:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - caliper_data:/data
    command:
      - "--addr=0.0.0.0:8080"
      - "--data-dir=/data"
      - "--console-dist=/app/console-dist"
      - "--alert-interval=30s"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-api:
    build: .
    entrypoint: ["/usr/local/bin/mock-api"]
    command: ["--addr=0.0.0.0:8090"]
    ports:
      - "8090:8090"

  caliper-seed:
    build: .
    depends_on:
      caliper:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        caliper-symbols upload --server http://caliper:8080 --app-id dev.caliper.demo --platform android --version 1.1.0 --build 110 --git-sha 1100002abcdef --kind r8_mapping --file /app/demo-symbols/atlas-android-1.1.0-110.r8.txt &&
        caliper-symbols upload --server http://caliper:8080 --app-id dev.caliper.demo --platform android --version 1.1.0 --build 110 --git-sha 1100002abcdef --kind hermes_sourcemap --file /app/demo-symbols/atlas-rn-1.1.0-110.sourcemap.json &&
        caliper-symbols upload --server http://caliper:8080 --app-id dev.caliper.demo --platform ios --version 1.1.0 --build 110 --git-sha 1100002abcdef --kind dsym --file /app/demo-symbols/atlas-ios-1.1.0-110.dsym.json &&
        seed-replay --target http://caliper:8080 --events 30000 --verify=true
    restart: "no"

  # Optional stateless production HA cluster profile (ClickHouse + PostgreSQL 16):
  #   docker compose --profile cluster up
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["cluster"]
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    profiles: ["cluster"]
    environment:
      POSTGRES_USER: caliper
      POSTGRES_PASSWORD: caliper_dev_password
      POSTGRES_DB: caliper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caliper -d caliper"]
      interval: 5s
      timeout: 3s
      retries: 10

  caliper-cluster:
    build: .
    profiles: ["cluster"]
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    volumes:
      - caliper_data:/data
    command:
      - "--addr=0.0.0.0:8080"
      - "--data-dir=/data"
      - "--storage-driver=clickhouse"
      - "--clickhouse-endpoint=http://clickhouse:8123"
      - "--clickhouse-db=caliper"
      - "--meta-driver=postgres"
      - "--postgres-dsn=postgres://caliper:caliper_dev_password@postgres:5432/caliper?sslmode=disable"
      - "--console-dist=/app/console-dist"
      - "--alert-interval=30s"

volumes:
  caliper_data:
  clickhouse_data:
  postgres_data:
